apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastcgi-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastcgi-backend
  template:
    metadata:
      labels:
        app: fastcgi-backend
    spec:
      priorityClassName: fastcgi-backend-high
      containers:
        - name: backend
          image: python:3.12-slim
          workingDir: /app
          command:
            - /bin/sh
            - -c
          args:
            - >-
              pip install --no-cache-dir fastapi uvicorn pymysql python-multipart
              && uvicorn main:app --host 0.0.0.0 --port 8000
          env:
            - name: MODULE_NAME
              value: main
            - name: DB_HOST
              value: mariadb
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: database
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /docs
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /docs
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: app-code
              mountPath: /app
      volumes:
        - name: app-code
          configMap:
            name: backend-app
