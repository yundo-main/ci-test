<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">3-Tier NetworkPolicy 통신 보호 흐름</title>
  <desc id="desc">3-Tier 구성 요소 사이의 허용 경로를 명시해 네트워크를 보호하고 정책에 포함되지 않은 통신을 제한하는 구조를 보여준다.</desc>
  <defs>
    <marker id="allow-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/>
    </marker>
    <marker id="deny-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .heading { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .body { font: 16px Arial, sans-serif; fill: #334155; }
      .small { font: 14px Arial, sans-serif; fill: #475569; }
      .deny { fill: #fef2f2; stroke: #ef4444; stroke-width: 2; }
      .controller { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 2; }
      .frontend { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; }
      .backend { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; }
      .database { fill: #fff7ed; stroke: #f97316; stroke-width: 2; }
      .dns { fill: #fefce8; stroke: #ca8a04; stroke-width: 2; }
      .allow { stroke: #16a34a; stroke-width: 2.5; fill: none; marker-end: url(#allow-arrow); }
      .blocked { stroke: #dc2626; stroke-width: 2; fill: none; stroke-dasharray: 8 7; marker-end: url(#deny-arrow); }
    </style>
  </defs>

  <rect width="1500" height="900" fill="#f8fafc"/>
  <text x="60" y="55" class="title">NetworkPolicy: 허용 경로를 명시한 통신 보호</text>
  <text x="60" y="86" class="body">기준 manifest: k8s/practice-order/12-networkpolicy/3tier-networkpolicy.yml</text>

  <rect x="60" y="125" width="380" height="230" rx="16" class="deny"/>
  <text x="92" y="170" class="heading">3tier-default-deny</text>
  <text x="92" y="210" class="body">대상: frontend · backend · mariadb</text>
  <text x="92" y="250" class="small">Ingress: 미허용 경로 제한</text>
  <text x="92" y="280" class="small">Egress: 미허용 경로 제한</text>
  <text x="92" y="320" class="small">Calico가 정책을 집행</text>

  <rect x="570" y="125" width="370" height="230" rx="16" class="controller"/>
  <text x="602" y="170" class="heading">Ingress Controller</text>
  <text x="602" y="210" class="body">namespace: ingress-nginx</text>
  <text x="602" y="250" class="small">Frontend: TCP 80 허용</text>
  <text x="602" y="280" class="small">Backend: TCP 8000 허용</text>
  <text x="602" y="320" class="small">NodePort: 30198</text>
  <path d="M440 240 H570" class="blocked"/>
  <text x="468" y="222" class="small">정책으로 통신 보호</text>

  <rect x="1060" y="125" width="370" height="230" rx="16" class="dns"/>
  <text x="1092" y="170" class="heading">CoreDNS</text>
  <text x="1092" y="210" class="body">namespace: kube-system</text>
  <text x="1092" y="250" class="small">UDP 53 허용</text>
  <text x="1092" y="280" class="small">TCP 53 허용</text>
  <text x="1092" y="320" class="small">Service DNS 조회</text>

  <rect x="70" y="470" width="300" height="190" rx="16" class="frontend"/>
  <text x="102" y="515" class="heading">Frontend Pod</text>
  <text x="102" y="555" class="body">app: frontend</text>
  <text x="102" y="595" class="small">TCP 80 수신</text>
  <text x="102" y="625" class="small">DNS 조회 가능</text>

  <rect x="480" y="470" width="330" height="190" rx="16" class="backend"/>
  <text x="512" y="515" class="heading">Backend Pod</text>
  <text x="512" y="555" class="body">app: fastcgi-backend</text>
  <text x="512" y="595" class="small">TCP 8000 수신</text>
  <text x="512" y="625" class="small">MariaDB·DNS 송신</text>

  <rect x="920" y="470" width="300" height="190" rx="16" class="database"/>
  <text x="952" y="515" class="heading">MariaDB Pod</text>
  <text x="952" y="555" class="body">app: mariadb</text>
  <text x="952" y="595" class="small">TCP 3306 수신</text>
  <text x="952" y="625" class="small">Backend만 접근 가능</text>

  <path d="M755 355 V430 H220 V470" class="allow"/>
  <text x="360" y="410" class="small">Controller → Frontend:80</text>
  <path d="M755 355 V430 H645 V470" class="allow"/>
  <text x="770" y="410" class="small">Controller → Backend:8000</text>
  <path d="M370 565 H480" class="allow"/>
  <text x="390" y="545" class="small">8000/TCP</text>
  <path d="M810 595 H920" class="allow"/>
  <text x="835" y="575" class="small">3306/TCP</text>
  <path d="M1060 355 V430 H220 V470" class="allow"/>
  <text x="1040" y="410" text-anchor="end" class="small">각 Pod → CoreDNS:53</text>

  <text x="60" y="755" class="heading">정책 확인</text>
  <text x="60" y="790" class="body">kubectl get networkpolicy</text>
  <text x="60" y="825" class="body">kubectl describe networkpolicy 3tier-default-deny</text>
</svg>
