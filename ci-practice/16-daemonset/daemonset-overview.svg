<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">DaemonSet과 Node Exporter, Prometheus, Grafana 흐름</title>
  <desc id="desc">DaemonSet이 각 Kubernetes 노드에 Node Exporter를 배치하고 내부 Headless Service를 통해 Prometheus가 메트릭을 수집한 뒤 Grafana가 시각화하는 구조</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1f2937" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
    <marker id="dashed-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .section { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e3a8a; }
      .box-title { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .box-text { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .label { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1d4ed8; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="34" y="28" width="1212" height="664" rx="22" fill="#ffffff" stroke="#dbe7f3" stroke-width="2"/>

  <text x="68" y="78" class="title">16. DaemonSet · Node Exporter · Prometheus · Grafana</text>
  <text x="68" y="108" class="subtitle">노드별 메트릭 제공과 선택형 수집 흐름</text>

  <text x="78" y="158" class="section">1. DaemonSet 배치</text>
  <rect x="78" y="178" width="262" height="116" rx="16" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="214" class="box-title">DaemonSet</text>
  <text x="100" y="241" class="box-text">node-exporter</text>
  <text x="100" y="266" class="small">노드마다 Pod 1개 배치</text>

  <path d="M340 236 H406" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="350" y="220" class="label">배치</text>

  <rect x="414" y="144" width="332" height="204" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="438" y="178" class="box-title">Kubernetes Nodes</text>

  <rect x="438" y="198" width="128" height="116" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="456" y="226" class="box-title" font-size="16">node-01</text>
  <text x="456" y="253" class="box-text">Node Exporter</text>
  <text x="456" y="278" class="small">:9100/metrics</text>

  <rect x="582" y="198" width="128" height="116" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="600" y="226" class="box-title" font-size="16">node-02</text>
  <text x="600" y="253" class="box-text">Node Exporter</text>
  <text x="600" y="278" class="small">:9100/metrics</text>

  <text x="456" y="334" class="small">각 노드의 CPU·메모리·파일시스템 메트릭</text>

  <path d="M746 246 H816" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="754" y="230" class="label">Endpoint</text>

  <text x="828" y="158" class="section">2. 메트릭 수집</text>
  <rect x="828" y="178" width="190" height="116" rx="16" fill="#dcfce7" stroke="#4ade80" stroke-width="2" filter="url(#shadow)"/>
  <text x="850" y="214" class="box-title">Headless Service</text>
  <text x="850" y="241" class="box-text">node-exporter</text>
  <text x="850" y="267" class="small">Pod IP 목록 제공</text>

  <path d="M1018 236 H1080" stroke="#64748b" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#dashed-arrow)"/>
  <text x="1026" y="220" class="label" fill="#475569">선택 적용</text>

  <rect x="1088" y="178" width="126" height="116" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="1108" y="214" class="box-title">Prometheus</text>
  <text x="1108" y="242" class="box-text">수집·저장</text>
  <text x="1108" y="268" class="small">:9090</text>

  <rect x="78" y="390" width="1136" height="226" rx="18" fill="#f8fafc" stroke="#dbe7f3" stroke-width="2"/>
  <text x="106" y="428" class="section">실습 검증 흐름</text>

  <rect x="106" y="456" width="238" height="116" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="128" y="490" class="box-title">1. DaemonSet 상태</text>
  <text x="128" y="518" class="box-text">desired = ready</text>
  <text x="128" y="545" class="small">노드 수만큼 Pod 실행</text>

  <path d="M344 514 H400" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="408" y="456" width="238" height="116" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="430" y="490" class="box-title">2. Endpoint 확인</text>
  <text x="430" y="518" class="box-text">Service → Pod IP</text>
  <text x="430" y="545" class="small">각 노드 주소 등록</text>

  <path d="M646 514 H702" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="710" y="456" width="238" height="116" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="732" y="490" class="box-title">3. 메트릭 확인</text>
  <text x="732" y="518" class="box-text">/metrics 응답</text>
  <text x="732" y="545" class="small">node_cpu·node_memory</text>

  <path d="M948 514 H1004" stroke="#64748b" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#dashed-arrow)"/>

  <rect x="1012" y="456" width="174" height="116" rx="14" fill="#fff7ed" stroke="#fdba74"/>
  <text x="1034" y="490" class="box-title">4. 시각화</text>
  <text x="1034" y="518" class="box-text">Grafana</text>
  <text x="1034" y="545" class="small">PromQL / dashboard</text>

  <text x="78" y="660" class="small">기본: Node Exporter · 내부 수집: Prometheus :9090 · 원격 서버 내부 확인: Grafana :30000</text>
</svg>
