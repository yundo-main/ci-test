apiVersion: v1
kind: Service
metadata:
  name: nfs-server
spec:
  selector:
    app: nfs-server
  ports:
    - name: nfs
      port: 2049
      targetPort: nfs
      protocol: TCP
    - name: rpcbind
      port: 111
      targetPort: rpcbind
      protocol: TCP
    - name: rpcbind-udp
      port: 111
      targetPort: rpcbind-udp
      protocol: UDP
    - name: mountd
      port: 32767
      targetPort: mountd
      protocol: TCP
    - name: mountd-udp
      port: 32767
      targetPort: mountd-udp
      protocol: UDP
    - name: statd
      port: 32765
      targetPort: statd
      protocol: TCP
    - name: statd-udp
      port: 32765
      targetPort: statd-udp
      protocol: UDP
