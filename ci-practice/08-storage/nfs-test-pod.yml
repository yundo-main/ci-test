apiVersion: v1
kind: Pod
metadata:
  name: nfs-pvc-test
spec:
  containers:
    - name: test
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - echo "nfs pvc test" > /data/hello.txt; sleep 3600
      volumeMounts:
        - name: nfs-data
          mountPath: /data
  volumes:
    - name: nfs-data
      persistentVolumeClaim:
        claimName: nfs-test-pvc
