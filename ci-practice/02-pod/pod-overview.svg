<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">nginx, FastAPI, MariaDB가 함께 실행되는 Kubernetes Pod</title>
  <desc id="desc">실제 3container.yml 구성에 맞춰 세 컨테이너가 하나의 Pod에서 네트워크 네임스페이스를 공유하고 localhost로 통신하는 구조와 Pod 생명주기를 보여준다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .heading { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .body { font: 16px Arial, sans-serif; fill: #334155; }
      .small { font: 14px Arial, sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
      .nginx { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; }
      .api { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; }
      .db { fill: #fff7ed; stroke: #f97316; stroke-width: 2; }
      .shared { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2; }
      .phase { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
      .line { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="820" fill="#f8fafc"/>
  <text x="60" y="58" class="title">Kubernetes Pod: nginx · FastAPI · MariaDB</text>
  <text x="60" y="88" class="body">기준 manifest: k8s/practice-order/02-pod/3container.yml</text>

  <rect x="60" y="125" width="900" height="390" rx="18" class="box"/>
  <text x="90" y="168" class="heading">nginx-fastapi-pod</text>
  <text x="90" y="195" class="small">세 컨테이너는 같은 노드와 네트워크 네임스페이스를 공유한다.</text>

  <rect x="95" y="235" width="245" height="115" rx="12" class="nginx"/>
  <text x="120" y="274" class="heading">nginx</text>
  <text x="120" y="302" class="body">HTTP :80</text>
  <text x="120" y="327" class="small">jarrodkim/nginx-test</text>

  <rect x="385" y="235" width="245" height="115" rx="12" class="api"/>
  <text x="410" y="274" class="heading">fastapi</text>
  <text x="410" y="302" class="body">API :8000</text>
  <text x="410" y="327" class="small">jarrodkim/fastapi-test</text>

  <rect x="675" y="235" width="245" height="115" rx="12" class="db"/>
  <text x="700" y="274" class="heading">mariadb</text>
  <text x="700" y="302" class="body">MySQL :3306</text>
  <text x="700" y="327" class="small">jarrodkim/mariadb-test</text>

  <path d="M340 292 H385" class="line"/>
  <text x="300" y="220" class="small">127.0.0.1:8000</text>
  <path d="M630 292 H675" class="line"/>
  <text x="590" y="220" class="small">mariadb:3306</text>

  <rect x="95" y="390" width="825" height="82" rx="12" class="shared"/>
  <text x="120" y="425" class="body">공유 네트워크 네임스페이스: localhost를 함께 사용</text>
  <text x="120" y="451" class="small">hostAliases: mariadb → 127.0.0.1 · 볼륨은 이 manifest에서 사용하지 않음</text>
  <path d="M217 350 V390" class="dashed"/>
  <path d="M507 350 V390" class="dashed"/>
  <path d="M797 350 V390" class="dashed"/>

  <rect x="1010" y="125" width="330" height="390" rx="18" class="box"/>
  <text x="1040" y="168" class="heading">실행 및 검증</text>
  <text x="1040" y="210" class="body">kubectl apply -f 3container.yml</text>
  <text x="1040" y="245" class="body">kubectl get pod</text>
  <text x="1040" y="280" class="body">kubectl describe pod</text>
  <text x="1040" y="315" class="body">kubectl logs -c fastapi</text>
  <path d="M960 310 H1010" class="line"/>
  <text x="1040" y="365" class="small">컨테이너 하나가 종료되면</text>
  <text x="1040" y="390" class="small">Pod 상태와 재시작 정책을 확인한다.</text>
  <text x="1040" y="435" class="small">직접 생성한 Pod는 삭제 후</text>
  <text x="1040" y="460" class="small">컨트롤러가 자동 복구하지 않는다.</text>

  <text x="60" y="585" class="heading">Pod 생명주기</text>
  <rect x="60" y="625" width="190" height="62" rx="12" class="phase"/>
  <text x="119" y="663" class="heading">Pending</text>
  <path d="M250 656 H330" class="line"/>
  <rect x="330" y="625" width="190" height="62" rx="12" class="phase"/>
  <text x="392" y="663" class="heading">Running</text>
  <path d="M520 656 H600" class="line"/>
  <rect x="600" y="625" width="205" height="62" rx="12" class="phase"/>
  <text x="644" y="663" class="heading">Succeeded</text>
  <path d="M520 680 C520 735 900 735 900 680" class="line"/>
  <rect x="900" y="625" width="190" height="62" rx="12" class="phase"/>
  <text x="963" y="663" class="heading">Failed</text>
  <text x="60" y="750" class="small">Pending: 스케줄링·이미지 준비 중 · Running: 컨테이너 실행 중 · Succeeded/Failed: 종료 상태</text>
</svg>
