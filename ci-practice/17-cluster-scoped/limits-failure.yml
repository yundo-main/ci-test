# LimitRange의 max 값을 초과하도록 의도적으로 작성한 실패 검증용 Pod다.
apiVersion: v1
kind: Pod
metadata:
  name: limits-failure-check
spec:
  containers:
    - name: nginx
      image: nginx:stable
      resources:
        # 3tier-limits.yml의 max.cpu=1, max.memory=1Gi보다 크다.
        requests:
          cpu: "2"
          memory: 2Gi
        limits:
          cpu: "2"
          memory: 2Gi
