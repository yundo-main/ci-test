apiVersion: v1
kind: ServiceAccount
metadata:
  name: fastcgi-backend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fastcgi-backend-reader
rules:
  - apiGroups: [""]
    resources:
      - services
      - endpoints
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fastcgi-backend-reader
subjects:
  - kind: ServiceAccount
    name: fastcgi-backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fastcgi-backend-reader
