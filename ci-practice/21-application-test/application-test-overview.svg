<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">애플리케이션 테스트 흐름</title>
  <desc id="desc">테스트 의존성을 설치하고 FastAPI 테스트 또는 Manifest 검사를 실행한 뒤 결과에 따라 이미지 빌드와 배포를 진행하거나 중단하는 흐름</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e293b" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .card-title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .body { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .label { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2563eb; }
      .mono { font: 400 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #334155; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#background)"/>
  <text x="64" y="64" class="title">21. 애플리케이션 테스트 흐름</text>
  <text x="64" y="94" class="subtitle">기능 검증에 성공한 경우에만 이미지 Build와 배포 단계로 진행한다</text>

  <rect x="64" y="132" width="1152" height="108" rx="18" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="92" y="166" class="label">INPUT</text>
  <text x="92" y="198" class="card-title">CI Manifest 검사 통과</text>
  <text x="92" y="222" class="body">문법과 Kubernetes 리소스 구조가 검증된 변경을 테스트한다.</text>
  <path d="M640 240 V278" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="64" y="286" width="1152" height="290" rx="18" fill="#eaf2ff" stroke="#93c5fd"/>
  <text x="92" y="322" class="label">TEST PIPELINE</text>
  <text x="92" y="350" class="card-title">애플리케이션 검증</text>

  <rect x="92" y="378" width="242" height="150" rx="14" fill="#ffffff" stroke="#bfdbfe" filter="url(#shadow)"/>
  <circle cx="128" cy="414" r="18" fill="#dbeafe"/>
  <text x="128" y="420" text-anchor="middle" class="label">1</text>
  <text x="158" y="419" class="card-title">준비</text>
  <text x="112" y="454" class="body">테스트 의존성을</text>
  <text x="112" y="476" class="body">설치한다.</text>
  <text x="112" y="507" class="mono">pip install pytest</text>

  <path d="M334 453 H370" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="382" y="378" width="242" height="150" rx="14" fill="#ffffff" stroke="#bfdbfe" filter="url(#shadow)"/>
  <circle cx="418" cy="414" r="18" fill="#dbeafe"/>
  <text x="418" y="420" text-anchor="middle" class="label">2</text>
  <text x="448" y="419" class="card-title">실행</text>
  <text x="402" y="454" class="body">API 또는 Manifest</text>
  <text x="402" y="476" class="body">검사를 실행한다.</text>
  <text x="402" y="507" class="mono">pytest / kubeconform</text>

  <path d="M624 453 H660" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="672" y="378" width="242" height="150" rx="14" fill="#ffffff" stroke="#bfdbfe" filter="url(#shadow)"/>
  <circle cx="708" cy="414" r="18" fill="#dbeafe"/>
  <text x="708" y="420" text-anchor="middle" class="label">3</text>
  <text x="738" y="419" class="card-title">결과 확인</text>
  <text x="692" y="454" class="body">상태 코드와 기능 결과를</text>
  <text x="692" y="476" class="body">확인한다.</text>
  <text x="692" y="507" class="mono">PASS / FAIL</text>

  <path d="M914 453 H950" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="962" y="378" width="226" height="150" rx="14" fill="#ffffff" stroke="#bfdbfe" filter="url(#shadow)"/>
  <circle cx="998" cy="414" r="18" fill="#dbeafe"/>
  <text x="998" y="420" text-anchor="middle" class="label">4</text>
  <text x="1028" y="419" class="card-title">Gate</text>
  <text x="982" y="454" class="body">성공: CD 진행</text>
  <text x="982" y="476" class="body">실패: 수정 후 재실행</text>
  <text x="982" y="507" class="mono">build / stop</text>

  <rect x="64" y="616" width="1152" height="58" rx="14" fill="#fff7ed" stroke="#fdba74"/>
  <text x="92" y="651" class="body">현재 저장소는 kubeconform Manifest 검사를 제공하며, FastAPI pytest는 소스와 tests 디렉터리 추가 후 확장한다.</text>
</svg>
