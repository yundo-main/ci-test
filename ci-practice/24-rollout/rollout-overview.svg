<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="13.333in" height="7.5in" preserveAspectRatio="xMidYMid meet" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Arial,sans-serif">
  <title>Deployment Rolling Update 흐름</title>
  <desc>Deployment의 이미지 변경으로 새 ReplicaSet과 Pod가 생성되고 readiness 확인 후 이전 Pod가 교체되는 과정을 보여준다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      .title{font-size:30px;font-weight:700;fill:#0f172a}.sub{font-size:16px;fill:#475569}.deploy{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2}.old{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.7}.new{fill:#ecfdf5;stroke:#10b981;stroke-width:2}.check{fill:#fff7ed;stroke:#f97316;stroke-width:1.7}.h{font-size:20px;font-weight:700;fill:#6d28d9}.g{font-size:19px;font-weight:700;fill:#047857}.o{font-size:18px;font-weight:700;fill:#c2410c}.t{font-size:14px;fill:#1e293b}.n{font-size:13px;fill:#64748b}.edge{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#94a3b8;stroke-width:1.6;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#fff"/>
  <text x="50" y="55" class="title">Deployment Rolling Update</text>
  <text x="50" y="84" class="sub">이미지 변경 → 새 ReplicaSet 생성 → readiness 확인 → 이전 Pod 교체</text>

  <rect x="45" y="130" width="230" height="180" rx="16" class="deploy"/>
  <text x="75" y="175" class="h">1. 이미지 변경</text>
  <text x="75" y="215" class="t">kubectl set image</text>
  <text x="75" y="245" class="t">Pod template 변경</text>
  <text x="75" y="280" class="n">Deployment revision 증가</text>

  <rect x="350" y="130" width="250" height="180" rx="16" class="deploy"/>
  <text x="380" y="175" class="h">2. 새 ReplicaSet</text>
  <text x="380" y="215" class="t">새 이미지 기준 생성</text>
  <text x="380" y="245" class="t">새 Pod 생성 시작</text>
  <text x="380" y="280" class="n">이전 ReplicaSet도 잠시 유지</text>

  <rect x="675" y="130" width="250" height="180" rx="16" class="check"/>
  <text x="705" y="175" class="o">3. readiness 확인</text>
  <text x="705" y="215" class="t">새 Pod가 Ready인지 확인</text>
  <text x="705" y="245" class="t">rollout status 대기</text>
  <text x="705" y="280" class="n">실패 시 교체가 멈춤</text>

  <rect x="1000" y="130" width="230" height="180" rx="16" class="new"/>
  <text x="1030" y="175" class="g">4. 교체 완료</text>
  <text x="1030" y="215" class="t">새 Pod가 트래픽 처리</text>
  <text x="1030" y="245" class="t">이전 Pod replicas 감소</text>
  <text x="1030" y="280" class="n">새 ReplicaSet이 현재 버전</text>

  <path d="M275 220H340" class="edge"/><path d="M600 220H665" class="edge"/><path d="M925 220H990" class="edge"/>

  <rect x="85" y="395" width="500" height="190" rx="16" class="old"/>
  <text x="120" y="440" class="h">이전 ReplicaSet</text>
  <rect x="120" y="470" width="180" height="55" rx="10" class="old"/>
  <text x="145" y="504" class="t">old Pod</text>
  <rect x="330" y="470" width="180" height="55" rx="10" class="old"/>
  <text x="355" y="504" class="t">old Pod</text>
  <text x="120" y="555" class="n">새 Pod가 Ready되면 replicas가 순차적으로 감소</text>

  <rect x="695" y="395" width="500" height="190" rx="16" class="new"/>
  <text x="730" y="440" class="g">새 ReplicaSet</text>
  <rect x="730" y="470" width="180" height="55" rx="10" class="new"/>
  <text x="755" y="504" class="t">new Pod</text>
  <rect x="940" y="470" width="180" height="55" rx="10" class="new"/>
  <text x="965" y="504" class="t">new Pod</text>
  <text x="730" y="555" class="n">readiness 통과 후 서비스 대상이 됨</text>

  <path d="M585 490H685" class="dash"/>
  <text x="50" y="650" class="n">확인: kubectl rollout status · kubectl get rs,pod · kubectl rollout history</text>
</svg>
