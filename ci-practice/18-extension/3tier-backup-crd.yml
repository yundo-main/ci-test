apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: threetierbackups.example.com
spec:
  group: example.com
  scope: Namespaced
  names:
    plural: threetierbackups
    singular: threetierbackup
    kind: ThreeTierBackup
    shortNames:
      - ttb
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - databaseService
                - backupPvc
              properties:
                databaseService:
                  type: string
                backupPvc:
                  type: string
                retentionDays:
                  type: integer
                  minimum: 1
      subresources:
        status: {}
